
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Enrollment Form</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0eaff, #f3e8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: #20243a;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(35, 42, 90, 0.12);
    }

    .heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .tag {
      display: inline-block;
      background: #eee8ff;
      color: #6341b5;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .heading p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dbe6;
      border-radius: 9px;
      font-size: 14px;
      background: white;
      color: #20243a;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #7654d6;
      box-shadow: 0 0 0 3px rgba(118, 84, 214, 0.12);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 23px;
      border: none;
      border-radius: 9px;
      background: #6547c8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5034ae;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    #status.success {
      display: block;
      background: #e7f8ed;
      color: #176b37;
    }

    #status.error {
      display: block;
      background: #ffeded;
      color: #a32121;
    }

    .footer {
      text-align: center;
      color: #85899b;
      font-size: 12px;
      margin-top: 22px;
    }

    @media (max-width: 520px) {
      .container {
        padding: 23px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="heading">
      <span class="tag">STUDENT REGISTRATION</span>
      <h1>Enrollment Form</h1>
      <p>Fill in your details to register for our learning program.</p>
    </header>

    <form id="enrollmentForm">

      <div class="form-grid">

        <div class="field">
          <label for="name">Full Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            maxlength="100"
            required>
        </div>

        <div class="field">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            maxlength="150"
            required>
        </div>

        <div class="field">
          <label for="phone">Phone Number *</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="10-digit mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            inputmode="numeric"
            required>
        </div>

        <div class="field">
          <label for="course">Select Course *</label>
          <select id="course" name="course" required>
            <option value="">Choose a course</option>
            <option value="Web Development">Web Development</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="Artificial Intelligence">
              Artificial Intelligence
            </option>
          </select>
        </div>

        <div class="field full-width">
          <label for="year">Year of Study *</label>
          <select id="year" name="year" required>
            <option value="">Select your year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field full-width">
          <label for="message">Why do you want to enroll?</label>
          <textarea
            id="message"
            name="message"
            placeholder="Tell us about your interests..."
            maxlength="1000"></textarea>
        </div>

      </div>

      <button type="submit" id="submitBtn">
        Submit Enrollment
      </button>

      <div id="status" role="status" aria-live="polite"></div>

    </form>

    <div class="footer">
      Student Enrollment Demo | Google Sheets Integration
    </div>

  </main>

  <script>
    // Your deployed Google Apps Script Web App URL
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzsrNYCQ4h76Gqc86_9iv_4fGy9g_dXHem1sLvosUVorHL4ndtd1bUntosuF8iUXLdcEg/exec";

    const form = document.getElementById("enrollmentForm");
    const button = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    function showStatus(type, message) {
      statusBox.className = type;
      statusBox.textContent = message;
      statusBox.style.display = "block";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";
      statusBox.style.display = "none";

      const formData = new FormData(form);
      const data = new URLSearchParams();

      for (const [key, value] of formData.entries()) {
        data.append(key, value.toString().trim());
      }

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: data
        });

        // no-cors cannot confirm whether Google saved the row.
        showStatus(
          "success",
          "Request sent! Please check the Enrollments tab in Google Sheets to confirm your registration."
        );

        form.reset();

      } catch (error) {
        showStatus(
          "error",
          "Could not send the request. Check your internet connection and Apps Script deployment."
        );

        console.error("Submission error:", error);

      } finally {
        button.disabled = false;
        button.textContent = "Submit Enrollment";
      }
    });
  </script>

</body>
</html>
